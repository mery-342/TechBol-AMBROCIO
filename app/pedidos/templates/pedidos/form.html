{% extends "base.html" %}
{% block content %}
<h2 class="h4 mb-3">{{ 'Editar' if pedido else 'Nuevo' }} pedido</h2>
<form method="post" class="row g-3 bg-white p-3 border rounded">
  <div class="col-md-6">
    <label class="form-label">Cliente</label>
    <select name="cliente_id" class="form-select" required>
      {% for c in clientes %}
      <option value="{{ c.id }}" {{ 'selected' if pedido and pedido.cliente_id == c.id }}>{{ c.nombre }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Producto</label>
    <select name="producto_id" class="form-select" required>
      {% for p in productos %}
      <option value="{{ p.id }}" {{ 'selected' if pedido and pedido.producto_id == p.id }}>
        {{ p.nombre }} (Bs {{ '%.2f'|format(p.precio) }} · stock {{ p.stock }})
      </option>
      {% endfor %}
    </select>
  </div>
  {% if pedido %}
  <div class="col-md-6">
    <label class="form-label">Monto (Bs)</label>
    <input type="number" step="0.01" min="0" name="monto" class="form-control" required value="{{ pedido.monto }}">
  </div>
  {% else %}
  <div class="col-md-6">
    <label class="form-label">Cantidad</label>
    <input type="number" min="1" name="cantidad" class="form-control" value="1" required>
  </div>
  {% endif %}
  <div class="col-12">
    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('pedidos.listar') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
