{% extends "base.html" %}
{% block content %}
<h2 class="h4 mb-3">{{ 'Editar' if cliente else 'Nuevo' }} cliente</h2>
<form method="post" class="row g-3 bg-white p-3 border rounded">
  <div class="col-md-6">
    <label class="form-label">Nombre</label>
    <input name="nombre" class="form-control" required value="{{ cliente.nombre if cliente else '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Teléfono</label>
    <input name="telefono" class="form-control" value="{{ cliente.telefono or '' if cliente else '' }}">
  </div>
  <div class="col-12">
    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('clientes.listar') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
