{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h2 class="h4">Clientes</h2>
  <a href="{{ url_for('clientes.nuevo') }}" class="btn btn-primary">+ Nuevo cliente</a>
</div>
<table class="table table-striped table-bordered bg-white">
  <thead class="table-dark"><tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Acciones</th></tr></thead>
  <tbody>
  {% for c in clientes %}
    <tr>
      <td>{{ c.id }}</td><td>{{ c.nombre }}</td><td>{{ c.telefono or '' }}</td>
      <td class="d-flex gap-2">
        <a class="btn btn-sm btn-warning" href="{{ url_for('clientes.editar', id=c.id) }}">Editar</a>
        <form method="post" action="{{ url_for('clientes.eliminar', id=c.id) }}"
              onsubmit="return confirm('¿Eliminar este cliente?')">
          <button class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="text-center text-muted">Sin clientes registrados.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
