{% extends "base.html" %}
{% block content %}
<h2 class="h4 mb-3">{{ 'Editar' if producto else 'Nuevo' }} producto</h2>
<form method="post" class="row g-3 bg-white p-3 border rounded">
  <div class="col-md-6">
    <label class="form-label">Nombre</label>
    <input name="nombre" class="form-control" required value="{{ producto.nombre if producto else '' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Precio (Bs)</label>
    <input type="number" step="0.01" min="0" name="precio" class="form-control" required value="{{ producto.precio if producto else '' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Stock</label>
    <input type="number" min="0" name="stock" class="form-control" required value="{{ producto.stock if producto else '' }}">
  </div>
  <div class="col-12">
    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('productos.listar') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
