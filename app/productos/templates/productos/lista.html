{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h2 class="h4">Productos</h2>
  <a href="{{ url_for('productos.nuevo') }}" class="btn btn-primary">+ Nuevo producto</a>
</div>
<table class="table table-striped table-bordered bg-white">
  <thead class="table-dark"><tr><th>ID</th><th>Nombre</th><th>Precio (Bs)</th><th>Stock</th><th>Acciones</th></tr></thead>
  <tbody>
  {% for p in productos %}
    <tr>
      <td>{{ p.id }}</td><td>{{ p.nombre }}</td>
      <td>{{ '%.2f'|format(p.precio) }}</td><td>{{ p.stock }}</td>
      <td class="d-flex gap-2">
        <a class="btn btn-sm btn-warning" href="{{ url_for('productos.editar', id=p.id) }}">Editar</a>
        <form method="post" action="{{ url_for('productos.eliminar', id=p.id) }}"
              onsubmit="return confirm('¿Eliminar este producto?')">
          <button class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="5" class="text-center text-muted">Sin productos registrados.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
